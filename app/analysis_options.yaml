include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/core/l10n/gen/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**

linter:
  rules:
    # App code, not a published package: doc comments where they help, not on every member.
    public_member_api_docs: false
