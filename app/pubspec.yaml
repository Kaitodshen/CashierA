name: cashiera
description: CashierA point of sale and back office.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  bcrypt: ^1.2.0
  cashiera_core:
    path: ../packages/cashiera_core
  clock: ^1.1.3
  collection: ^1.19.1
  connectivity_plus: 7.3.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  excel_plus: ^2.29.2
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_thermal_printer: ^2.3.0
  go_router: ^18.1.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  printing: ^5.15.1
  riverpod_annotation: ^4.0.7
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.18.3
  toastification: ^3.2.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans[wght].ttf
